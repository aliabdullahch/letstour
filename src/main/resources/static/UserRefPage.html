<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .heading{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: xx-large ;
            font-weight: bold;
            text-align: center;
        }
        .normalText{
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: large ;
            font-weight: bold;
            text-align: center;

        }
        .formText
        {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: large;
            font-weight: bold;
            

        }
        .parent{
            height: 90vh;
            width: 100vw;
            background-image: url("http://localhost:8080/uploads/form-back.jpg");
            background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
            
            
        }
        .leftContainer{
            
            height: 100%;
            

        }
        .rightContainer{

            height: 100%; 
        }
        .imageprofile{
            height:50%;
            width: 100%;
            background-color: antiquewhite;
            border-radius: 55px;

        }
        .my-form{
            height: 100%;
            width: 100%;
        margin-left: 10px;
            display: flex;
            flex-direction: column;
            align-items: start;
        
            background-size: cover;
            

        }
        .submit{
            margin-top: 10vh;
            display: inline-block;
            border-radius: 16px;
            background-color: aqua;
        }
        .booking-class{
            margin-top: 0vh;
            margin-right: 0%;
        }
    </style>


    </head>

    <body>
        <div class="heading">
            Hey Tourist! Enter your details here.
        </div>
        <div class="row parent">
            <!--left side container-->
            <div class="col-md-4 leftContainer">
                <div class="mt-4">
                    <img src="/uploads/profile-cover.png" class="imageprofile">

                </div>
            </div>
            <!-- Right side Container-->
             <div class="col-md-8 rightContainer">
                <div class="my-form">
                    <div class="normalText mt-3">Enter Your Details Here</div>
                    <form action="http://localhost:8080/api/v1/users" class="my-form" method="POST">
                        <label class="formText" for="firstName"> First  Name:</label>
                        <input type="text" name="firstName" id="firstName">
                        <br>
                        <label class="formText" for="lastName"> Last  Name</label>
                        <input type ="text" name="lastName" id="lastName">
                        <br>
                        <label class="formText" for="email">Email</label>
                        <input type="text" name="email" id="email">
                        <br>

                        <label class="formText" for="address">Address</label>
                        <input type="text" name="address" id="address">
                        <br>
                        <label class="formText" for="phoneNo">Phone no.</label>
                        <input type="text" name="phoneNo" id="phoneNo">
                        <br>

                        <button class="submit" >Register</button>
                        <br>
                      

                    </form>
                    <button class="booking-class" onclick="createBooking()">Book Package</button>


                </div>


             </div>

        </div>
        <script>
            function createBooking()
            {
                // getting the pacakge Id
                const params = new URLSearchParams(window.location.search)
                const packageId =params.get("packageId")
                // getting id of the user created
                fetch(`http://localhost:8080/api/v1/bookings?packId=${packageId}&userId=1`,
                {
                    method:"POST",
                    headers:{
                        'Content-type':"application/json"
                    }
                }
                ).then(response=>response.json()).then(data=>{
                    console.log("Booking created successfully")


                })
            }


        </script>
        


    </body>
</html>
