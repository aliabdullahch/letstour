<!DOCTYPE html>

<head>
    <!--Including the linking for the Bootstrap and Font awesome libarraie-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        html
{
    font-size: clamp(0.5rem, 1.1vw, 2rem);
}
p
{
font-size:0.75rem

}
body {
    margin: 0;
    padding: 0;
    background-image: url('https://i.ibb.co/QSz5Dc6/fdc398865623.jpg');
    background-size: cover;
    background-position: center;
    height: 100vh;
    position: relative;

}

.background-overlay {
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    /* 🔹 semi-transparent black */
    z-index: 0;
    position: absolute;
}

.form {

    height: auto;
    min-height:500px;
    width: 60vw;
    background-color: rgba(0, 0, 0, 0.5);
    border-radius: 22px;
    margin-left: 40vw;
    padding: 10px;
    top: 10%;
    z-index: 1;
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: space-between;


}

.label-input {
    display: flex;
    gap: 5px;


}

.labelText {
    font-size: 1.25rem;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: lightgrey;
    margin-right: 0.5em;
    margin-left:0.25em;
}

.inputBox {
    border-radius: 3px;
    height: auto;
    width: 20vw;
    background-color: white;
}

.combined {
    display: flex;
    flex-direction: row;
    justify-content: space-between;

}
.titleText{
    font-family:Georgia, 'Times New Roman', Times, serif;
    font-size: 32px;
    align-content: center;
    color: whitesmoke;
    align-items: center;
    margin-left: 20vw;

}
body {
margin: 0;
height: 100vh;
background-image: url('https://i.ibb.co/QSz5Dc6/fdc398865623.jpg');
background-size: cover;       /* Scales image to cover the entire page */
background-position: center;  /* Centers the image */
background-repeat: no-repeat; /* Prevents tiling */
background-attachment: fixed; /* Optional: keeps image fixed when scrolling */
}
        @media(max-width:630px)
        {

        .combined {
    display: flex;
    flex-direction: column;
    justify-content:start;


             }
             .label-input {
    display: flex;
    gap: 5px;
    margin-bottom:3em;


}




        }
    </style>

</head>

<body>


    <form action="/api/v1/register" class="form" method="post">
        <div class="titleText">
            <h3>TourSpot.com</h3>
        </div>

        <div class="combined">
            <div class="label-input">
                <label for="firstName" class="labelText">First Name</label>
                <input type="text" name="firstName" id="firstName" class="inputBox">
            </div>
            <div class="label-input">
                <label for="lastName" class="labelText">Last Name</label>
                <input type="text" name="lastName" id="lastName" class="inputBox">
            </div>
        </div>
        <div class="combined">
            <div class="label-input">
                <label for="email" class="labelText">Email</label>
                <input type="email" name="email" id="email" class="inputBox">
            </div>
            <div class="label-input">
                <label for="address" class="labelText">Address</label>
                <input type="text" name="address" id="address" class="inputBox">
            </div>
        </div>
        <div class="combined">
            <div class="label-input">
                <label for="phoneNo" class="labelText">Phone No.</label>
                <input type="number" name="phoneNo" id="phoneNo" class="inputBox">
            </div>
            <div class="label-input">
                <label for="password" class="labelText">Password</label>
                <input type="password" name="password" id="password" class="inputBox">
            </div>

        </div>
        <button class="btn btn-primary" style="color: white; background-color: green; width: 30vw;margin-left: 10vw;" type="submit">Register</button>

    </form>




</body>
