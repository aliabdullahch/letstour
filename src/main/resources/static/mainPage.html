    <script>
        function fetchByName(name,date,persons)
        {
        document.getElementById("mainCardGrid").innerHTML = "";
        fetch(`http://localhost:8080/api/v1/destinations?name=${name}&date=${date}&persons=${persons}`,
                    {
                    method: 'GET',
                    headers: {
                        'Content-type': "application/json"
                    }
                }
        ).
        then
        (
                response => response.json()).then(data =>
                {
                    const cardRowGrid = document.getElementById("mainCardGrid")
                    data.forEach(element => {

                        let prevFound = document.querySelector(`#card-${element.id}`);
                        console.log(`The value for the item with id ${element.id} is ${prevFound}`);
                        if (!prevFound) {
                        getReviewDetails(element.name,element.id)
                            let containerColumn = document.createElement("div")
                            containerColumn.className = "col";
                            containerColumn.id = `card-${element.id}`;
                            containerColumn.innerHTML = `

                        <div class="customCard" onClick=getDetails(${element.id})>
                        <div><img class="imageDiv" src="${element.imagePath}" alt="Card image cap"></div>
                        <div class="cardDesc">
                            <i class="fa-sharp fa-solid fa-heart likeIcon"></i>
                            <h5 class="cardTitle">${element.name}</h5>
                            <p class="cardSmallText two-lines">${element.description}</p>
                            <div class="reviewSection">
                            <div class="averageRating" id="avgRat-${element.id}">2.0</div>
                            <div class="noOfReviews" id="totalRev-${element.id}">15 Reviews</div>
                        </div>
                        </div>
                    </div>

                    `
                            cardRowGrid.append(containerColumn)

                        }



                    });

                }

        )
        }
        function getReviewDetails(name,id)
        {
          fetch(`http://localhost:8080/api/v1/reviewDetails?name=${name}`,
                {
                    method: 'GET',
                    headers: {
                        'Content-type': "application/json"
                    }
                }
            ).then(response=>response.json()).then(
            data =>{
            const averageRatingElement=document.getElementById(`avgRat-${id}`);
            const totalReviewsElement=document.getElementById(`totalRev-${id}`);
            averageRatingElement.textContent=`${data.averageRating}`;
            totalReviewsElement.textContent=`${data.noOfReviews} Reviews`;
            }

            )

        }

        function fetchAllPlaces() {
        console.log("The innner height of the browser is as follows")
        console.log(window.innerHeight)
        document.getElementById("mainCardGrid").innerHTML = "";
            fetch("http://localhost:8080/api/v1/tourDestinations",
                {
                    method: 'GET',
                    headers: {
                        'Content-type': "application/json"
                    }
                }
            ).then(

                response => response.json()).then(data => {
                    const cardRowGrid = document.getElementById("mainCardGrid")
                    data.forEach(element => {
                        let prevFound = document.querySelector(`#card-${element.id}`);
                        console.log(`The value for the item with id ${element.id} is ${prevFound}`);
                        if (!prevFound) {
                            getReviewDetails(element.name,element.id)
                            let containerColumn = document.createElement("div")
                            containerColumn.className = "col";
                            containerColumn.id = `card-${element.id}`;
                            containerColumn.innerHTML = `
                        <div class="customCard" onClick=getDetails(${element.id})>
                        <img class="imageDiv" src="${element.imagePath}" alt="Card image cap">
                        <div class="cardDesc">
                            <i class="fa-sharp fa-solid fa-heart likeIcon"></i>
                            <h5 class="cardTitle">${element.name}</h5>
                            <p class="cardSmallText two-lines">${element.description}</p>
                            <div class="reviewSection">
                            <div class="averageRating" id="avgRat-${element.id}">2.0</div>
                            <div class="noOfReviews" id="totalRev-${element.id}">15 Reviews</div>
                        </div>
                    </div>
                    </div>
                    `
                            cardRowGrid.append(containerColumn)

                        }



                    });


                }

                )
        }
        function getDetails(id) {
            window.location.href = `/TourPlace.html?id=${id}`;

        }

<script>
    function appendFilterData()
    {
       document.getElementById("mainCardGrid").innerHTML = "";
       let checkedBoxes=document.querySelectorAll("aside.asideStyle input[type=checkbox]:checked");
       if(checkedBoxes.length===0)
       {
       console.log("Fetching All");
       fetchAllPlaces();
       }
       checkedBoxes.forEach(box=>{
       getFilterData(box.getAttribute("data-category"), box.getAttribute("value"))
       });

    }

    function getFilterData(type, value)
  {

      fetch(`http://localhost:8080/api/v1/filterTourDestinations?type=${type}&value=${value}`,
          {
              method: 'GET',
              headers: {
                  'Content-type': "application/json"
              }
          }
      ).then(response => response.json()).then(data => {
          const cardRowGrid = document.getElementById("mainCardGrid")
          data.forEach(element => {

              let prevFound = document.querySelector(`#card-${element.id}`);
              console.log(`The value for the item with id ${element.id} is ${prevFound}`);
              if (!prevFound)
              {
                  getReviewDetails(element.name, element.id)
                  let containerColumn = document.createElement("div")
                  containerColumn.className = "col";
                  containerColumn.id = `card-${element.id}`;
                  containerColumn.innerHTML = `

                  <div class="customCard" onClick=getDetails(${element.id})>
                  <img class="imageDiv card-img-top" src="${element.imagePath}" alt="Card image cap">
                  <div class="cardDesc">
                      <i class="fa-sharp fa-solid fa-heart likeIcon"></i>
                      <h5 class="cardTitle">${element.name}</h5>
                      <p class="cardSmallText two-lines">${element.description}</p>
                      <div class="reviewSection">
                      <div class="averageRating" id="avgRat-${element.id}">2.0</div>
                      <div class="noOfReviews" id="totalRev-${element.id}">15 Reviews</div>
                  </div>
                  </div>
              </div>

              `
                  cardRowGrid.append(containerColumn)

              }



          })
      });


  }
fetch("http://localhost:8080/api/v1/areaTypes",{
  method:'GET',
  headers:{
      'Content-type':"application/json"
  }
}).then(response => response.json()).then(data =>{
  let areaTypeFilte=document.getElementById("areaTypeFilter");
  data.values.forEach(element => {
      let  singleFilter=document.createElement("div");
      singleFilter.className="filterRow";
      singleFilter.innerHTML =`
      <div><label for= ${element} class="mid-text">${element}</label></div>
      <div><input onClick="appendFilterData()" type="checkbox" id=${element} data-category="area_type" value=${element} style="width: 1vw; height: 1vw;" /></div>
      `;
      areaTypeFilte.appendChild(singleFilter);

  })
  const leftFilterArea= document.querySelector(".asideStyle")
  console.log("The left filter area node is ")
  console.log(leftFilterArea)
  leftFilterArea.style.height="auto";
})

dateEle.style.display='none'
}


});
dateEle.style.display==='none'?
(()=>{
